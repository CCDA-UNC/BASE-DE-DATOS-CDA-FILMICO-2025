            <textarea id="login-proposito" placeholder="Propósito de uso..." required></textarea>

    </div>

    <div id="app-container" style="display: none;">
        <h1>BASE DE DATOS CDA</h1>
        <div id="main-view">
            <div id="filter-section" style="display: none;">
                <h2>Búsqueda y Filtros</h2> 
                <div><input type="text" id="globalSearch" placeholder="Búsqueda global..." style="width: 95%;"></div>
                <div style="margin-top: 15px;">
                    <select id="columnSelect"></select>
                    <input type="text" id="columnFilterValue" list="column-suggestions" placeholder="Valor...">

                    <datalist id="column-suggestions"></datalist>
                </div>

                <div id="activeFilters"><p>Ninguno.</p></div>
            </div>
            
            <div id="results-section">
                <h2>Resultados</h2>
                <button id="viewSelectionBtn" style="display: none;">Mi Selección (0)</button>
                <button id="clearSelectionBtn" style="display: none;">Limpiar Selección</button>
                <button id="downloadBtn" style="display: none;">Descargar CSV</button>
                <button id="downloadExcelBtn" style="display: none;">Descargar Excel</button> 
                
                <div id="resultsCount">Inicializando sistema...</div>
                
                <div id="table-wrapper">
                    <table id="dataTable">
                        <thead></thead>
                        <tbody><tr><td>Cargando datos...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div id="selection-view" style="display: none;">
            <h2>Mi Selección</h2>
            <button id="backToSearchBtn">Volver a la Búsqueda</button>
            <button id="downloadSelectionBtn">Descargar Selección (CSV)</button>
            <button id="downloadSelectionExcelBtn">Descargar Selección (Excel)</button> 
            <div id="selectionCount" style="margin-top:15px;"></div>
            <div id="selection-table-wrapper">
                <table id="selectionTable"><thead></thead><tbody></tbody></table>
            </div>
        </div>
    </div>

    <div id="detail-modal-overlay">
        <div id="detail-modal-content">
            <button id="detail-modal-close">&times;</button>
            <h2>Detalle del Registro</h2>
            <div id="detail-content"></div>
        </div>
    </div>

    <script>
        let idColumn = '_INTERNAL_ID_'; 
        let videoLinkColumn = 'Link'; 

        let originalData = [];  
        let headers = []; 
        let headersToShow = []; 
        let activeColumnFilters = {}; 
        let columnUniqueValues = new Map(); 
        let currentVisibleData = []; 
        let selectedRowIDs = new Set(); 
        
        const resultsCount = document.getElementById('resultsCount');
        const tableHead = document.querySelector('#dataTable thead');
        const tableBody = document.querySelector('#dataTable tbody');

        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); 
            const authorizedEmail = "archfilm@ffyh.unc.edu.ar";
            const inputEmail = document.getElementById('login-email').value.trim();
            if (inputEmail.toLowerCase() === authorizedEmail.toLowerCase()) {
                document.getElementById('login-view').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                loadCsvFromUrl();
            } else { 
                alert("Acceso denegado. El email no está autorizado."); 
            }
        });

        function loadCsvFromUrl() {
const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQYwzS5XouerY_Pw_Bwb-mWrnU3ND6Pzi_q1GI_usW8VwC-d2clXXK75Jrlw-oa8XoVXqp0ff-KZH7P/pub?gid=1068718906&single=true&output=csv";            
            resultsCount.textContent = "Conectando con Google Sheets y descargando datos...";
            tableBody.innerHTML = '<tr><td colspan="10">Por favor, espera unos segundos. Descargando base de datos...</td></tr>';

            Papa.parse(csvUrl, {
                download: true, 
                header: false, 
                skipEmptyLines: true, 
                encoding: "UTF-8", 
                complete: function(results) { 
                    try {
                        if (!results || !results.data || results.data.length === 0) {
                            throw new Error("El archivo CSV se descargó pero está vacío.");
                        }
                        processLoadedData(results); 
                    } catch (err) {
                        resultsCount.textContent = "Error al procesar los datos: " + err.message;
                        tableBody.innerHTML = `<tr><td colspan="10" style="color:red;">Ha ocurrido un error procesando los datos. Revisa la consola (F12). Detalle: ${err.message}</td></tr>`;
                    }
                },
                error: function(err) {
                    resultsCount.textContent = "Error crítico de conexión o lectura.";
                    tableBody.innerHTML = `<tr><td colspan="10" style="color:red;">Error descargando CSV: ${err.message}. Asegúrate de que el link de Google Sheets esté publicado en la web.</td></tr>`;
                }
            });
        }

        function processLoadedData(results) {
            resultsCount.textContent = "Procesando columnas y limpiando datos...";
            const rawHeaders = results.data[0];
            const rawDataRows = results.data.slice(1);
            const headerMap = new Map();

            // Evitar nombres de columnas repetidos
            rawHeaders.forEach((headerName, index) => {
                const cleanHeader = String(headerName || "").trim().replace(/\s+/g, ' ');
                if (!cleanHeader) return; 
                if (!headerMap.has(cleanHeader)) { headerMap.set(cleanHeader, []); }
                headerMap.get(cleanHeader).push(index);
            });

            headers = Array.from(headerMap.keys());
            headers.push(idColumn); // Forzamos una columna ID interna siempre

            originalData = [];
            rawDataRows.forEach((rawRow, rowIndex) => {
                if (rawRow.every(cell => (cell || "").trim() === "")) return; 
                const newRow = {};
                for (const cleanHeader of headers) {
                    if (cleanHeader === idColumn) continue;
                    const indices = headerMap.get(cleanHeader);
                    const values = indices.map(index => String(rawRow[index] || "").trim()).filter(val => val !== "");
                    newRow[cleanHeader] = values.join("; ");
                }
                
                // Generar ID único para cada fila para que la lupita NUNCA falle
                let rowMfn = newRow['MFN'] || newRow['mfn'] || newRow['ID'] || newRow['id'];
                newRow[idColumn] = rowMfn ? String(rowMfn).trim() : 'AUTO-' + (rowIndex + 1);
                
                originalData.push(newRow);
            });

            // Seleccionar las columnas a mostrar ("fecha", "titulo", "lugar", "resumen")
            headersToShow = [];
            const keywordsBuscadas = ['fecha', 'titulo', 'título', 'lugar', 'resumen'];
            
            keywordsBuscadas.forEach(kw => {
                const found = headers.find(h => h.toLowerCase().includes(kw) && !headersToShow.includes(h));
                if (found) headersToShow.push(found);
            });
            
            // Fallback: si no encuentra esas palabras, muestra las primeras 4 columnas que existan
            if (headersToShow.length === 0) {
                headersToShow = headers.filter(h => h !== idColumn).slice(0, 4);
            }

            // Descubrir cuál es la columna de "Link" o video
            const foundLinkCol = headers.find(h => h.toLowerCase().includes('link') || h.toLowerCase().includes('video'));
            if (foundLinkCol) videoLinkColumn = foundLinkCol;

            currentVisibleData = [...originalData]; 
            
            // Construir menús desplegables
            rebuildDatalists(originalData); 
            populateColumnSelect(); 
            
            // Mostrar los datos
            renderTable(originalData); 
            
            // Habilitar la interfaz
            document.getElementById('filter-section').style.display = 'block'; 
            document.getElementById('downloadBtn').style.display = 'inline-block'; 
            document.getElementById('downloadExcelBtn').style.display = 'inline-block'; 
            document.getElementById('viewSelectionBtn').style.display = 'inline-block'; 
            document.getElementById('clearSelectionBtn').style.display = 'inline-block'; 
            
            resultsCount.style.color = '#333'; // Quitar color rojo de error
            resultsCount.textContent = `Mostrando ${originalData.length} de ${originalData.length} registros.`;
        }

        function renderTable(data) {
            tableHead.innerHTML = ''; tableBody.innerHTML = ''; 
            const headerRow = document.createElement('tr');
            
            headerRow.innerHTML += `<th><input type="checkbox" id="selectAllCheckbox" title="Seleccionar todo"></th>`;
            headerRow.innerHTML += `<th>Detalle</th>`; 
            headerRow.innerHTML += `<th>Video</th>`;  
            
            for (const header of headersToShow) { 
                const th = document.createElement('th'); 
                th.textContent = header; 
                headerRow.appendChild(th); 
            }
            tableHead.appendChild(headerRow); 
            
            if (data.length === 0) { 
                tableBody.innerHTML = `<tr><td colspan="10" style="text-align:center;">No se encontraron resultados.</td></tr>`; 
                return; 
            }
            
            const fragment = document.createDocumentFragment();
            data.forEach((row) => {
                const tr = document.createElement('tr'); 
                const rowID = row[idColumn]; 
                
                const tdCheck = document.createElement('td');
                const isChecked = selectedRowIDs.has(rowID) ? "checked" : ""; 
                tdCheck.innerHTML = `<input type="checkbox" class="row-checkbox" data-row-id="${rowID}" ${isChecked}>`;
                tr.appendChild(tdCheck);
                
                const tdDetail = document.createElement('td'); 
                tdDetail.innerHTML = `<button class="detail-btn" data-row-id="${rowID}" title="Ver detalle completo">🔍</button>`; 
                tr.appendChild(tdDetail);

                const tdVideo = document.createElement('td');
                const videoUrl = row[videoLinkColumn] ? String(row[videoLinkColumn]).trim() : ''; 
                if (videoUrl && (videoUrl.startsWith('http') || videoUrl.startsWith('/'))) { 
                    tdVideo.innerHTML = `<a href="${videoUrl}" target="_blank" rel="noopener noreferrer" class="video-direct-link" title="Abrir video">▶️</a>`; 
                }
                tr.appendChild(tdVideo);

                for (const header of headersToShow) { 
                     const cellContent = row[header] ? row[header] : ''; 
                     const td = document.createElement('td'); 
                     td.innerHTML = `<div class="cell-content">${cellContent}</div>`; 
                     tr.appendChild(td); 
                }
                fragment.appendChild(tr);
            });
            tableBody.appendChild(fragment); 
            updateSelectAllCheckboxState();
        }

        function rebuildDatalists(dataToProcess) {
            columnUniqueValues = new Map(); 
            headers.forEach(header => { if(header && header !== idColumn) columnUniqueValues.set(header, new Set()); });
            for (const row of dataToProcess) {
                for (const header of columnUniqueValues.keys()) { 
                    let cellValue = row[header] ? String(row[header]).trim() : "";
                    if (cellValue) columnUniqueValues.get(header).add(cellValue); 
                }
            } 
        }

        function populateColumnSelect() {
            const columnSelect = document.getElementById('columnSelect');
            columnSelect.innerHTML = ''; 
            for (const header of headers) { 
                if (header && header !== idColumn) { 
                    const option = document.createElement('option'); 
                    option.value = header; option.textContent = header; 
                    columnSelect.appendChild(option); 
                }
            }
            updateColumnDatalist();
        }

        function updateColumnDatalist() {
            const columnSelect = document.getElementById('columnSelect');
            const columnDatalist = document.getElementById('column-suggestions');
            const selectedColumn = columnSelect.value; 
            const valuesSet = columnUniqueValues.get(selectedColumn);
            columnDatalist.innerHTML = ''; 
            if (!valuesSet) return;
            const sortedValues = Array.from(valuesSet).sort((a, b) => a.localeCompare(b));
            const columnFragment = document.createDocumentFragment();
            sortedValues.forEach(value => { 
                const option = document.createElement('option'); 
                option.value = value; 
                columnFragment.appendChild(option); 
            });
            columnDatalist.appendChild(columnFragment);
        }

        function applyAllFilters() {
            let filteredData = [...originalData]; 
            const globalTerm = document.getElementById('globalSearch').value.toLowerCase().trim();
            
            if (globalTerm) { 
                filteredData = filteredData.filter(row => 
                    Object.values(row).some(value => String(value).toLowerCase().includes(globalTerm)) 
                ); 
            }
            
            const columnFilters = Object.entries(activeColumnFilters);
            if (columnFilters.length > 0) {
                filteredData = filteredData.filter(row => {
                    return columnFilters.every(([column, filterValues]) => {
                        const cellValue = row[column] ? String(row[column]).toLowerCase() : "";
                        return filterValues.every(filterValue => cellValue.includes(filterValue));
                    });
                });
            }
            
            renderTable(filteredData); 
            currentVisibleData = filteredData; 
            resultsCount.textContent = `Mostrando ${filteredData.length} de ${originalData.length} registros.`;
        }

        document.getElementById('addFilterBtn').addEventListener('click', () => {
            const column = document.getElementById('columnSelect').value; 
            const value = document.getElementById('columnFilterValue').value.toLowerCase().trim();
            if (!value) return; 
            if (!activeColumnFilters[column]) activeColumnFilters[column] = [];
            if (!activeColumnFilters[column].includes(value)) activeColumnFilters[column].push(value);
            document.getElementById('columnFilterValue').value = ''; 
            renderActiveFilters(); 
            applyAllFilters();
        });

        function renderActiveFilters() {
            const activeFiltersDiv = document.getElementById('activeFilters');
            activeFiltersDiv.innerHTML = ''; 
            let hasFilters = false; 
            for (const column in activeColumnFilters) {
                activeColumnFilters[column].forEach((value, index) => {
                    hasFilters = true;
                    const tag = document.createElement('div'); tag.className = 'filter-tag';
                    tag.innerHTML = `<strong>${column}</strong>: "${value}" <span data-column="${column}" data-index="${index}">&times;</span>`; 
                    tag.querySelector('span').addEventListener('click', (e) => {
                        const colToRemove = e.target.dataset.column;
                        const indexToRemove = parseInt(e.target.dataset.index, 10); 
                        activeColumnFilters[colToRemove].splice(indexToRemove, 1);
                        if (activeColumnFilters[colToRemove].length === 0) delete activeColumnFilters[colToRemove];
                        renderActiveFilters(); applyAllFilters();     
                    });
                    activeFiltersDiv.appendChild(tag);
                });
            }
            if (!hasFilters) activeFiltersDiv.innerHTML = '<p>Ninguno.</p>';
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            document.getElementById('globalSearch').value = ''; 
            activeColumnFilters = {}; 
            renderActiveFilters();
            renderTable(originalData); 
            currentVisibleData = [...originalData]; 
            resultsCount.textContent = `Mostrando ${originalData.length} de ${originalData.length} registros.`;
        });

        document.getElementById('globalSearch').addEventListener('input', applyAllFilters);
        document.getElementById('columnSelect').addEventListener('change', updateColumnDatalist);

        tableBody.addEventListener('click', (event) => {
            const target = event.target; 
            if (target.classList.contains('row-checkbox')) {
                if (target.checked) selectedRowIDs.add(target.dataset.rowId); 
                else selectedRowIDs.delete(target.dataset.rowId);
                updateSelectAllCheckboxState(); updateSelectionCount();
            } else if (target.classList.contains('detail-btn')) { 
                showDetails(target.dataset.rowId); 
            }
        });

        tableHead.addEventListener('click', (event) => {
            if (event.target.id === 'selectAllCheckbox') {
                const isChecked = event.target.checked; 
                const rowCheckboxes = tableBody.querySelectorAll('.row-checkbox');
                currentVisibleData.forEach(row => { 
                    if (isChecked) selectedRowIDs.add(row[idColumn]); 
                    else selectedRowIDs.delete(row[idColumn]); 
                });
                rowCheckboxes.forEach(checkbox => checkbox.checked = isChecked); 
                updateSelectionCount();
            }
        });

        function updateSelectAllCheckboxState() {
            const selectAllCheckbox = document.getElementById('selectAllCheckbox'); 
            if (!selectAllCheckbox) return;
            const totalVisibleRows = currentVisibleData.length; 
            if (totalVisibleRows === 0) { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false; return; }
            let visibleSelectedCount = 0; 
            currentVisibleData.forEach(row => { if (selectedRowIDs.has(row[idColumn])) visibleSelectedCount++; });
            if (visibleSelectedCount === totalVisibleRows && totalVisibleRows > 0) { selectAllCheckbox.checked = true; selectAllCheckbox.indeterminate = false; } 
            else if (visibleSelectedCount > 0) { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = true; } 
            else { selectAllCheckbox.checked = false; selectAllCheckbox.indeterminate = false; }
        }

        function updateSelectionCount() { 
            document.getElementById('viewSelectionBtn').textContent = `Mi Selección (${selectedRowIDs.size})`; 
        }

        function showDetails(rowID) {
            const record = originalData.find(row => row[idColumn] === rowID); 
            if (!record) return; 
            const detailContent = document.getElementById('detail-content');
            detailContent.innerHTML = ''; 
            headers.forEach(header => {
                if (header && header !== idColumn) { 
                     const value = record[header] ? String(record[header]) : '(vacío)'; 
                     const detailItem = document.createElement('div');
                     if (header === videoLinkColumn) {
                         const trimmedValue = value.trim(); let videoEmbedHtml = '';
                         let youtubeMatch = trimmedValue.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
                         if (youtubeMatch && youtubeMatch[2].length === 11) { 
                             videoEmbedHtml = `<div class="embedded-video-container"><iframe src="[https://www.youtube.com/embed/$](https://www.youtube.com/embed/$){youtubeMatch[2]}" frameborder="0" allowfullscreen></iframe></div>`; 
                         } else if (trimmedValue !== '(vacío)' && (trimmedValue.startsWith('http') || trimmedValue.startsWith('/'))) { 
                             detailItem.innerHTML = `<strong>${header}:</strong> <a href="${trimmedValue}" target="_blank" style="color:#28a745;">Ver Recurso ↗</a>`; 
                         } else { detailItem.innerHTML = `<strong>${header}:</strong> ${value}`; }
                         if (videoEmbedHtml) detailItem.innerHTML = `<strong>${header}:</strong>${videoEmbedHtml}`;
                     } else { detailItem.innerHTML = `<strong>${header}:</strong> ${value}`; }
                     detailContent.appendChild(detailItem);
                }
            }); 
            document.getElementById('detail-modal-overlay').style.display = 'flex'; 
        }

        document.getElementById('detail-modal-close').addEventListener('click', () => {
            document.getElementById('detail-modal-overlay').style.display = 'none'; 
        });
        
        // Botones de Vistas y Descargas
        document.getElementById('viewSelectionBtn').addEventListener('click', () => toggleViews(true));
        document.getElementById('backToSearchBtn').addEventListener('click', () => toggleViews(false));
        document.getElementById('clearSelectionBtn').addEventListener('click', () => {
            if (confirm("¿Vaciar selección?")) {
                selectedRowIDs.clear(); updateSelectionCount(); 
                renderTable(currentVisibleData); 
                document.querySelector('#selectionTable tbody').innerHTML = '';
            }
        });

        function toggleViews(showSelection) {
            if (showSelection) { 
                document.getElementById('main-view').style.display = 'none'; 
                document.getElementById('selection-view').style.display = 'block'; 
                renderSelectionTable(); 
            } else { 
                document.getElementById('main-view').style.display = 'block'; 
                document.getElementById('selection-view').style.display = 'none'; 
                renderTable(currentVisibleData); 
            }
        }

        function renderSelectionTable() {
            const sBody = document.querySelector('#selectionTable tbody');
            const sHead = document.querySelector('#selectionTable thead');
            sHead.innerHTML = ''; sBody.innerHTML = '';
            const selectedData = originalData.filter(row => selectedRowIDs.has(row[idColumn]));
            document.getElementById('selectionCount').textContent = `Mostrando ${selectedData.length} items seleccionados.`;
            
            const headerRow = document.createElement('tr'); 
            headerRow.innerHTML = '<th>Quitar</th><th>Detalle</th><th>Video</th>'; 
            headersToShow.forEach(h => { const th = document.createElement('th'); th.textContent = h; headerRow.appendChild(th); });
            sHead.appendChild(headerRow); 
            
            if (selectedData.length === 0) return;
            const fragment = document.createDocumentFragment();
            selectedData.forEach(row => {
                const tr = document.createElement('tr'); 
                const rowID = row[idColumn];
                tr.innerHTML = `<td><button class="remove-item-btn" data-row-id="${rowID}" style="background:red;padding:5px;">&times;</button></td>
                                <td><button class="detail-btn" data-row-id="${rowID}">🔍</button></td>
                                <td>${row[videoLinkColumn] ? `<a href="${row[videoLinkColumn]}" target="_blank" class="video-direct-link">▶️</a>` : ''}</td>`;
                headersToShow.forEach(h => { tr.innerHTML += `<td><div class="cell-content">${row[h] || ''}</div></td>`; });
                fragment.appendChild(tr);
            }); 
            sBody.appendChild(fragment);
        }

        document.querySelector('#selectionTable tbody').addEventListener('click', (e) => {
            const target = e.target;
            if (target.classList.contains('remove-item-btn')) { 
                selectedRowIDs.delete(target.dataset.rowId); 
                updateSelectionCount(); 
                renderSelectionTable(); 
            } else if (target.classList.contains('detail-btn')) { 
                showDetails(target.dataset.rowId); 
            }
        });

        function downloadCSV() {
            let data = selectedRowIDs.size > 0 ? originalData.filter(row => selectedRowIDs.has(row[idColumn])) : currentVisibleData;
            if(data.length === 0) return;
            const csv = Papa.unparse(data, { header: true });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8-sig;' }); 
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = "reporte.csv";
            link.click();
        }
        document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
        document.getElementById('downloadSelectionBtn').addEventListener('click', downloadCSV);

        function downloadExcel() {
            let data = selectedRowIDs.size > 0 ? originalData.filter(row => selectedRowIDs.has(row[idColumn])) : currentVisibleData;
            if(data.length === 0) return;
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Datos");
            XLSX.writeFile(wb, "reporte.xlsx");
        }
        document.getElementById('downloadExcelBtn').addEventListener('click', downloadExcel);
        document.getElementById('downloadSelectionExcelBtn').addEventListener('click', downloadExcel);

    </script>
</body>
</html>
